name: Release LSP binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,     target: aarch64-apple-darwin,       archive: tar.gz }
          - { os: macos-14,     target: x86_64-apple-darwin,        archive: tar.gz }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu,   archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: windows-2022, target: x86_64-pc-windows-msvc,     archive: zip }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lsp

      - name: Build
        working-directory: lsp
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ matrix.target }}"
          stem="package-json-upgrade-lsp-${arch%%-*}-${arch#*-}"
          mkdir -p dist
          tar -C lsp/target/${{ matrix.target }}/release \
              -czf dist/$stem.tar.gz package-json-upgrade-lsp
          ls -la dist/

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $arch = "${{ matrix.target }}"
          $parts = $arch -split '-', 2
          $stem  = "package-json-upgrade-lsp-$($parts[0])-$($parts[1])"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
              -Path "lsp/target/${{ matrix.target }}/release/package-json-upgrade-lsp.exe" `
              -DestinationPath "dist/$stem.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
