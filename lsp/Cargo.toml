[package]
name = "package-json-upgrade-lsp"
version = "0.0.7"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "package-json-upgrade-lsp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip"], default-features = false }
nodejs-semver = "4"
regex = "1"
dashmap = "6"
url = "2"
percent-encoding = "2"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
